allowBuilds:
  sharp: true

overrides:
  postcss: 8.5.25
  sharp: 0.35.0
  # Transitive under postcss. Patches GHSA-2v37-7h3g-55p8 (nanoid infinite
  # loop when a custom generator is called with size 0). Capped to the 3.x
  # line (^3.3.18) so it stays within postcss@8.5.25's ^3.3.11 constraint;
  # an unbounded >= pulls nanoid 6.x (ESM rewrite) and breaks postcss.
  nanoid: "^3.3.18"
