name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required for softprops/action-gh-release

jobs:
  build-and-release:
    name: Build dist artifacts and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for setuptools-scm version detection

      - name: Set up locked build environment
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version-file: .python-version

      - name: Install locked build tools
        run: uv sync --locked --extra build --extra config

      - name: Build wheel and sdist
        run: uv run --locked --extra build python -m build

      - name: Twine check
        run: uv run --locked --extra build python -m twine check dist/*.whl dist/*.tar.gz

      - name: Build shiv binary from locked requirements
        run: make shiv

      - name: List dist artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/audit.pyz
          generate_release_notes: true
