name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish, for example v0.1.1"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate release ref
        run: |
          case "${{ inputs.ref }}" in
            v*) ;;
            *) echo "PyPI publishes must use a PEP 440-compatible v* release tag."; exit 1 ;;
          esac

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up locked build environment
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version-file: .python-version

      - name: Install locked build tools
        run: uv sync --locked --extra build

      - name: Build wheel and sdist
        run: uv run --locked --extra build python -m build

      - name: Twine check
        run: uv run --locked --extra build python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
