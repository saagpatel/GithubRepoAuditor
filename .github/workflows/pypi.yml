name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish, for example v0.1.1"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate release ref
        run: |
          case "${{ inputs.ref }}" in
            v*) ;;
            *) echo "PyPI publishes must use a PEP 440-compatible v* release tag."; exit 1 ;;
          esac

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up locked build environment
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version-file: .python-version

      - name: Install locked build tools
        run: uv sync --locked --extra build

      - name: Build wheel and sdist
        run: uv run --locked --extra build python -m build

      - name: Twine check
        run: uv run --locked --extra build python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
