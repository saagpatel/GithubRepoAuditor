version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # pyproject.toml intentionally keeps Ruff on the reviewed 0.15 line until
      # the Ruff 0.16 rule migration is handled as its own cleanup change.
      - dependency-name: "ruff"
        versions: [">=0.16"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
