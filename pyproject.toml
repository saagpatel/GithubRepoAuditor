[build-system]
requires = ["setuptools==84.1.0", "setuptools-scm==10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-auditor"
dynamic = ["version"]
description = "Automated GitHub portfolio auditor with 13 analysis dimensions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Saag Patel" }]
keywords = [
    "github",
    "portfolio",
    "audit",
    "repository-analysis",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "radon>=6.0.1",
    "rich>=13.0",
    "anthropic>=0.40.0",
    "fpdf2>=2.8.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Ruff 0.16 enables a materially wider ruleset under the repository's
    # implicit selection; keep CI on the reviewed 0.15 line until that migration
    # is handled as its own cleanup change.
    "ruff>=0.4,<0.16",
    "mypy>=1.10",
    "mutmut>=3.6,<4",
    "responses>=0.25",
    "types-PyYAML>=6.0",
]
config = ["pyyaml>=6.0"]
semantic = [
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=6.2.0",
]
serve = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
]
hosting = [
    # Optional: a shared Redis/Upstash backend for the hosted report cache and
    # per-IP throttle. Without it, the in-memory backend is used (single-instance).
    "redis>=5.0",
]
build = [
    "shiv>=1.0.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/saagpatel/GithubRepoAuditor"
Repository = "https://github.com/saagpatel/GithubRepoAuditor"
"Bug Tracker" = "https://github.com/saagpatel/GithubRepoAuditor/issues"
Changelog = "https://github.com/saagpatel/GithubRepoAuditor/blob/main/CHANGELOG.md"
Documentation = "https://github.com/saagpatel/GithubRepoAuditor#readme"

[project.scripts]
audit = "github_repo_auditor.cli:main"
operator-os-seam-linter = "github_repo_auditor.operator_os_seam_linter:main"
operator-os-producer-preflight = "github_repo_auditor.producer_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["github_repo_auditor*"]

[tool.setuptools.package-data]
"github_repo_auditor" = [
    "*.json",
    "*.yaml",
    "*.yml",
    "*.html",
    "*.jinja2",
    "*.j2",
    "assets/excel/*.xlsx",
    "serve/static/*.css",
    "serve/static/*.js",
    "serve/templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/github_repo_auditor/auto_apply.py", "src/github_repo_auditor/scorer.py"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests/test_auto_apply.py",
    "tests/test_scorer.py",
]

[tool.ruff]
target-version = "py312"

[tool.uv]
required-version = "==0.13.0"
constraint-dependencies = [
    # fpdf2's Pillow range still permits versions affected by GHSA-332p-7hrc-92wf
    # and the related Pillow advisories.
    "pillow>=13.0.0",
    # requests/httpx still permit certifi versions affected by GHSA-6q48-6c7w-9gw2.
    "certifi>=2026.10.18",
    # The semantic extra's torch/huggingface-hub parents retain older floors.
    "filelock>=4.2.1", # GHSA-v4x8-3wr5-3wq8 and related filelock advisories.
    "fsspec>=2026.6.0", # GHSA-27vj-qcqg-25rc.
    # shiv/torch permit setuptools versions affected by GHSA-xmj3-9gf7-h52w.
    "setuptools>=84.1.0",
]

[tool.ruff.lint]
ignore = ["E501"]

[tool.setuptools_scm]
fallback_version = "0.1.4"
